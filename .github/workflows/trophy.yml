name: Generate trophy card

on:
  schedule:
    - cron: "0 */12 * * *" # Triggers safely twice a day

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create output directory
        run: mkdir -p build # Creates a fresh folder so it doesn't upload your whole repo

      - name: generate trophy.svg
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: ${{ github.repository_owner }}
          file: build/trophy.svg # Generates the file safely inside the clean folder
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: dracula
          max-rows: 1
          margin-width: 8
          margin-height: 8
          no-background: false
          no-frame: false

      - name: push trophy.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: trophy-output
          build_dir: build # Uploads ONLY the trophy file to the branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
