name: Generate trophy card

on:
  schedule:
    - cron: "0 */12 * * *" # Triggers safely twice a day

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: generate trophy.svg
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: ${{ github.repository_owner }}
          file: trophy.svg # FIXED: Generates it in the root folder, not inside /dist
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: dracula
          max-rows: 1
          margin-width: 8
          margin-height: 8
          no-background: false
          no-frame: false

      - name: push trophy.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: trophy-output
          build_dir: . # FIXED: Pushes from the root folder instead of looking for /dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
